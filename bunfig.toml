[test]
# Coverage is measured with `bun run test:coverage`, not on every `bun test`.
coverageSkipTestFiles = true
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"

# Well above the 80% floor, with room for a new branch to land uncovered
# before it blocks. Raise to 1 to ratchet the current state in place.
[test.coverageThreshold]
line = 0.9
function = 0.9
