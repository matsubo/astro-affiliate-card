name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  biome:
    runs-on: ubuntu-latest
    name: Biome
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            src
            biome.json

      # Pinned to the devDependency: a newer formatter would disagree with what
      # the pre-commit hook produced and fail a branch that is locally clean.
      - name: Setup Biome
        uses: biomejs/setup-biome@29711cbb52afee00eb13aeb30636592f9edc0088 # v2.7.0
        with:
          version: 2.5.10

      - name: Run Biome
        run: biome ci ./src --reporter=github

  tests:
    runs-on: ubuntu-latest
    name: Tests
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # The threshold in bunfig.toml gates per file, so this fails on a module
      # that lands without tests -- which is the point of running it here.
      - name: Run tests with coverage
        run: bun run test:coverage

      # The package ships dist/, so a build that breaks is a release that breaks.
      - name: Build the package
        run: bun run build
